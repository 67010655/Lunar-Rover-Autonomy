name: Baseline tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Run closed-loop demo and render figures
        run: python -m lunar_rover --scenario configs/scenarios/synthetic_obstacles.json --localization ideal --seed 42 --output outputs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-python-${{ matrix.python-version }}
          path: outputs/ci/
