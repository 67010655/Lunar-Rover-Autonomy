[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-rover-autonomy"
version = "0.1.0"
description = "Reproducible synthetic baseline for lunar rover navigation research"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["matplotlib>=3.9,<4", "Pillow>=10,<13"]

[project.scripts]
lunar-rover = "lunar_rover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
